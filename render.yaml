services:
  - type: web
    name: ileap-member-portal-api
    env: node
    # Keep the existing instance type configured in Render. With plan omitted,
    # an existing service retains its current type and a new service defaults to Starter.
    # Production must not use a Free instance; verify the current plan in the dashboard.
    rootDir: member-portal
    # NODE_ENV is production during the build, so explicitly include the
    # TypeScript/Vite/React type packages required to compile the application.
    buildCommand: npm ci --include=dev && npm run build && npm run prisma:migrate:deploy
    startCommand: npm run start
    # Render supports one HTTP health path. Readiness is the correct choice
    # because it prevents routing traffic when PostgreSQL is unavailable.
    healthCheckPath: /api/ready
    maxShutdownDelaySeconds: 15
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: ENABLE_DEMO_CLEANUP
        value: "false"
      - key: CLIENT_ORIGIN
        value: https://member.ileapclub.com
      - key: CLIENT_ORIGINS
        value: https://member.ileapclub.com,https://members.ileapclub.com
