services:
  - type: web
    name: ileap-member-portal-api
    env: node
    # Keep the existing instance type configured in Render. With plan omitted,
    # an existing service retains its current type and a new service defaults to Starter.
    # Production must not use a Free instance; verify the current plan in the dashboard.
    rootDir: member-portal
    buildCommand: npm install && npm run build && npm run prisma:migrate:deploy
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://member.ileapclub.com
      - key: CLIENT_ORIGINS
        value: https://member.ileapclub.com,https://members.ileapclub.com
