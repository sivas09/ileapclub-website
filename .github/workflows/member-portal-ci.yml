name: Member Portal CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-member-portal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ileap_ci?schema=public
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters
      CLIENT_ORIGIN: http://localhost:5173
      CLIENT_ORIGINS: http://localhost:5173
      NODE_ENV: test
      ENABLE_DEMO_CLEANUP: "false"
    defaults:
      run:
        working-directory: member-portal

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: member-portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and type-check
        run: npm run check

      - name: Run full test suite
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Validate Prisma schema
        run: npx prisma validate
